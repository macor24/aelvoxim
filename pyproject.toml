[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aelvoxim"
version = "1.2.0"
requires-python = ">=3.10"
description = "知境 (Aelvoxim) — Lightweight AI Cognitive Engine Framework — give your AI a memory, metacognition, and self-learning"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "macor24", email = "macor@gealss.com"},
]
keywords = ["ai", "agent", "cognitive-engine", "memory", "self-learning", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    # 2026-11-04: 运行时依赖一律钉死到"线上实测版本"。
    # 原因：此前 pyproject 写 >=0.162.0、线上跑 0.139.0，下一次 pip install -e .
    # 会为了满足下限把 fastapi 推 22 个版本（含 6 个 breaking），而且是在一次
    # "正常部署"里悄悄发生。升级要单独排期 + 跑回归，不许夹在部署里。
    "bcrypt==5.0.0",
    "fastapi==0.139.0",
    "uvicorn[standard]==0.51.0",
    # 代码里 17 个文件直接 import httpx，之前只是靠传递依赖被带进来（未声明）。
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "psycopg2-binary==2.9.12",
    # 2026-11-04: 这里只列**代码真正 import 的**包（fastapi/uvicorn/httpx/bcrypt/
    # psycopg2/pydantic）。原来的 Pillow / numpy 在 src/ 与 scripts/ 里 0 引用，
    # 却因为 numpy==2.5.1 只支持 Python>=3.12，把整个项目的 requires-python
    # 硬拖到 3.12，直接让 CI 的 3.10/3.11 矩阵装不上。它们仍留在
    # requirements.txt（部署环境用），但不再当库依赖。
    # 2026-11-03: GHSA-6q48-6c7w-9gw2 (critical) — certifi < 2026.10.19 仍带
    # emSign ECC Root CA - G3，其下级中间证书私钥已泄露（可被用于 MITM）。
    # 刻意保留下限（不钉死）：CA 包越新越好，且这是安全修复线。
    "certifi>=2026.10.19",
]

[tool.ruff]
# 显式声明规则集：ruff 的默认集随版本扩张（0.16 默认已含 UP/BLE/S/DTZ/SIM/C4/RUF…），
# 不声明就会让 CI 门禁随依赖漂移而变红/变绿（master 已因此红了一周）。
# 这里只保留【正确性】规则：F(pyflakes: 未定义名/未用导入/未用变量/重复定义) + E9(语法/IO)。
# 风格迁移(pyupgrade UP006 List→list 等 1600+ 处)与 pycodestyle 风格类(E4/E7)属独立工程，
# 不在本门禁内 —— 需要时另开一次批量整改，不要混进功能提交。
[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files are the package API surface: a name may be imported only
# to be re-exported, so "unused import" is not actionable there.
"**/__init__.py" = ["F401"]
# Admin panel is a defensive aggregation script: it probes many subsystems
# and intentionally swallows per-subsystem failures (BLE001/S110) and parses
# naive timestamps (DTZ007) from status files.
"src/aelvoxim/server/admin_panel.py" = ["BLE001", "S110", "DTZ007"]

[project.optional-dependencies]
pg = ["psycopg2-binary>=2.9.0"]
test = ["pytest>=9.2.0", "httpx>=0.28.1"]
dev = ["aelvoxim[pg,test]", "build>=1.6.1", "twine>=7.0.0"]
full = ["aelvoxim[pg]"]

[project.urls]
Homepage = "https://github.com/macor24/aelvoxim"
Repository = "https://github.com/macor24/aelvoxim"
Documentation = "https://github.com/macor24/aelvoxim/tree/master/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aelvoxim = ["**/*.html"]

[project.scripts]
aelvoxim = "aelvoxim.__main__:main"
aelvoxim-admin = "aelvoxim.admin:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gateway: marks tests that need Windows Gateway running",
]
addopts = "-v --tb=short -q"
filterwarnings = ["ignore::DeprecationWarning"]
